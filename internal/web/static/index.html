<!DOCTYPE html>

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <!-- Light theme keeps color-scheme light so dark-mode extensions (Dark
       Reader, Chrome Auto Dark Mode, etc.) run their full inversion. The
       dark theme switches it to dark and adds a darkreader-lock meta so
       Dark Reader leaves our own palette alone. Resolved before first
       paint; src/theme.ts keeps it live. -->
  <meta name="color-scheme" content="light" />
  <script>
    (function () {
      var p = null;
      try { p = localStorage.getItem('hy-theme'); } catch (e) {}
      var dark = p === 'dark' || (p !== 'light' && !!window.matchMedia && matchMedia('(prefers-color-scheme: dark)').matches);
      document.documentElement.setAttribute('data-theme', dark ? 'dark' : 'light');
      if (dark) {
        document.querySelector('meta[name="color-scheme"]').setAttribute('content', 'dark');
        var m = document.createElement('meta');
        m.name = 'darkreader-lock';
        document.head.appendChild(m);
      }
    })();
  </script>
