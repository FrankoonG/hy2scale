name: Release

# Runs only on the code of a release tag: a tag push, or a manual run
# started from the tag itself ("Use workflow from" = the tag;
# trigger-release.yml does that after creating the tag).
#
# Jobs and what they may touch:
#   version   reads the tag and the version constant      no token, no secrets
#   frontend  builds the web UI (npm, no install scripts) read-only token
#   build     builds the binaries (go only)               read-only token
#   sign      signs the built binaries                    the signing key only;
#             (environment "release"; never checks out    no repository code
#             or runs repository code)
#   package / docker   archives, images, iKuai packages   read-only token
#   openwrt   OpenWrt .ipk/.apk packages                  read-only token
#   release   publishes the GitHub release                contents: write
#   publish-docker     pushes to Docker Hub               Docker Hub token only
on:
  push:
    tags:
      - "[0-9]*"
      - "v[0-9]*"
  workflow_dispatch:

permissions: {}

concurrency:
  group: release-${{ github.ref_name }}
  cancel-in-progress: false

env:
  GO_VERSION: "1.27"
  # Public half of the release signing key (internal/buildsig: "hy2scale-1").
  SIGNING_KEY_ID: hy2scale-1
  SIGNING_PUBLIC_KEY: qacIdvM9YVk+SbRNEsSiXqTyxTizsKKlJm06Z1KyYlc=

jobs:
  version:
    name: Resolve version
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      tag: ${{ steps.v.outputs.tag }}
      version: ${{ steps.v.outputs.version }}
      binary_version: ${{ steps.v.outputs.binary_version }}
      prerelease: ${{ steps.v.outputs.prerelease }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
          sparse-checkout: internal/api/server.go
          sparse-checkout-cone-mode: false
      - id: v
        env:
          REF_TYPE: ${{ github.ref_type }}
          TAG: ${{ github.ref_name }}
        run: |
          set -eu
          if [ "$REF_TYPE" != tag ]; then
            echo "::error::run this workflow from a release tag (Use workflow from: <tag>)"
            exit 1
          fi
          if ! printf '%s' "$TAG" | grep -Eq '^v?[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.]+)?$'; then
            echo "::error::not a release tag: $TAG"
            exit 1
          fi
          VERSION="${TAG#v}"
          BINVER="$(sed -n 's/^const Version = "\([0-9A-Za-z.-]*\)"$/\1/p' internal/api/server.go)"
          case "$VERSION" in
            "$BINVER"|"$BINVER"-*) ;;
            *) echo "::error::tag $TAG does not match the source version $BINVER"; exit 1 ;;
          esac
          {
            echo "tag=$TAG"
            echo "version=$VERSION"
            echo "binary_version=$BINVER"
            case "$VERSION" in *-*) echo "prerelease=true" ;; *) echo "prerelease=false" ;; esac
          } >> "$GITHUB_OUTPUT"

  # ─── Web UI (no secrets; npm runs in this job only) ──────────────
  frontend:
    name: Build web UI
    needs: version
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 20

      # Dependencies' install scripts never run.
      - name: Build
        run: |
          set -eux
          (cd web/ui-framework && npm ci --ignore-scripts && npm run build)
          (cd web/app && npm ci --ignore-scripts && npm run build)

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: web-static
          path: web/app/dist/
          if-no-files-found: error

  # ─── Binaries (no secrets; go only) ──────────────────────────────
  build:
    name: Build ${{ matrix.platform }}
    needs: [version, frontend]
    runs-on: ubuntu-latest
    permissions:
      contents: read
    strategy:
      fail-fast: true
      matrix:
        include:
          - { platform: linux-amd64, goarch: amd64 }
          - { platform: linux-arm64, goarch: arm64 }
          - { platform: linux-armv7, goarch: arm, goarm: "7" }
          - { platform: linux-mips64le, goarch: mips64le }
          - { platform: linux-mipsle-softfloat, goarch: mipsle, gomips: softfloat }
          - { platform: linux-386, goarch: "386", go386: softfloat }
          - { platform: linux-armv5, goarch: arm, goarm: "5" }
          - { platform: linux-armv6, goarch: arm, goarm: "6" }
          - { platform: linux-mips-softfloat, goarch: mips, gomips: softfloat }
          - { platform: linux-mips64, goarch: mips64 }
          - { platform: linux-riscv64, goarch: riscv64 }
          - { platform: linux-loong64, goarch: loong64 }
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      # The binary embeds internal/web/static: the UI built from this
      # commit, never the committed bundle.
      - name: Use the built web UI
        run: rm -rf internal/web/static

      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: web-static
          path: internal/web/static

      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: false

      - name: Build binary
        env:
          CGO_ENABLED: "0"
          GOOS: linux
          GOARCH: ${{ matrix.goarch }}
          GOARM: ${{ matrix.goarm }}
          GOMIPS: ${{ matrix.gomips }}
          GO386: ${{ matrix.go386 }}
          PLATFORM: ${{ matrix.platform }}
        run: |
          set -eu
          go build -trimpath -ldflags="-s -w" -o "hy2scale-${PLATFORM}" ./cmd/node
          sha256sum "hy2scale-${PLATFORM}"

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: bin-${{ matrix.platform }}
          path: hy2scale-${{ matrix.platform }}
          if-no-files-found: error

  # ─── Signing (the key, nothing else) ─────────────────────────────
  # Configure the "release" environment in the repository settings: the
  # secret RELEASE_SIGNING_KEY (the Ed25519 private key, PEM) and a
  # deployment rule that allows release tags only.
  sign:
    name: Sign binaries
    needs: [version, build]
    runs-on: ubuntu-latest
    environment: release
    permissions: {}
    steps:
      # Each expected binary by its exact artifact name, nothing else.
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: bin-linux-amd64
          path: in/linux-amd64
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: bin-linux-arm64
          path: in/linux-arm64
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: bin-linux-armv7
          path: in/linux-armv7
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: bin-linux-mips64le
          path: in/linux-mips64le
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: bin-linux-mipsle-softfloat
          path: in/linux-mipsle-softfloat
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: bin-linux-386
          path: in/linux-386
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: bin-linux-armv5
          path: in/linux-armv5
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: bin-linux-armv6
          path: in/linux-armv6
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: bin-linux-mips-softfloat
          path: in/linux-mips-softfloat
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: bin-linux-mips64
          path: in/linux-mips64
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: bin-linux-riscv64
          path: in/linux-riscv64
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: bin-linux-loong64
          path: in/linux-loong64

      - name: Check the binaries
        run: |
          set -eu
          mkdir bin
          for p in \
            'linux-amd64:ELF 64-bit LSB.*x86-64' \
            'linux-arm64:ELF 64-bit LSB.*ARM aarch64' \
            'linux-armv7:ELF 32-bit LSB.*ARM' \
            'linux-mips64le:ELF 64-bit LSB.*MIPS' \
            'linux-mipsle-softfloat:ELF 32-bit LSB.*MIPS' \
            'linux-386:ELF 32-bit LSB.*Intel (80386|i386)' \
            'linux-armv5:ELF 32-bit LSB.*ARM' \
            'linux-armv6:ELF 32-bit LSB.*ARM' \
            'linux-mips-softfloat:ELF 32-bit MSB.*MIPS' \
            'linux-mips64:ELF 64-bit MSB.*MIPS' \
            'linux-riscv64:ELF 64-bit LSB.*RISC-V' \
            'linux-loong64:ELF 64-bit LSB.*LoongArch'; do
            plat="${p%%:*}"; want="${p#*:}"
            [ "$(ls "in/$plat")" = "hy2scale-$plat" ] || { echo "::error::unexpected files for $plat: $(ls "in/$plat")"; exit 1; }
            kind="$(file -b "in/$plat/hy2scale-$plat")"
            echo "$kind" | grep -Eq "$want" || { echo "::error::hy2scale-$plat is not $want: $kind"; exit 1; }
            mv "in/$plat/hy2scale-$plat" bin/
          done

      - name: Sign
        env:
          SIGNING_KEY: ${{ secrets.RELEASE_SIGNING_KEY }}
          VERSION: ${{ needs.version.outputs.binary_version }}
          TAG: ${{ needs.version.outputs.tag }}
          COMMIT: ${{ github.sha }}
        run: |
          set -eu
          if [ -z "$SIGNING_KEY" ]; then
            echo "::error::RELEASE_SIGNING_KEY is not set in the release environment"
            exit 1
          fi
          umask 077
          KEY="$RUNNER_TEMP/release.key"
          trap 'rm -f "$KEY"' EXIT
          printf '%s\n' "$SIGNING_KEY" > "$KEY"
          PUB="$(openssl pkey -in "$KEY" -pubout -outform DER | tail -c 32 | base64 -w0)"
          if [ "$PUB" != "$SIGNING_PUBLIC_KEY" ]; then
            echo "::error::RELEASE_SIGNING_KEY is not the key $SIGNING_KEY_ID"
            exit 1
          fi
          cd bin
          for f in hy2scale-*; do
            PLATFORM="${f#hy2scale-}"
            SUM="$(sha256sum "$f" | cut -d' ' -f1)"
            jq -cn --arg v "$VERSION" --arg p "$PLATFORM" --arg s "$SUM" --arg c "$COMMIT" --arg t "$TAG" \
              '{name:"hy2scale",version:$v,platform:$p,sha256:$s,commit:$c,tag:$t}' > "$RUNNER_TEMP/m.json"
            openssl pkeyutl -sign -inkey "$KEY" -rawin -in "$RUNNER_TEMP/m.json" -out "$RUNNER_TEMP/m.sig"
            jq -cn --arg k "$SIGNING_KEY_ID" --arg m "$(base64 -w0 "$RUNNER_TEMP/m.json")" --arg s "$(base64 -w0 "$RUNNER_TEMP/m.sig")" \
              '{key:$k,manifest:$m,sig:$s}' > "$f.sig"
            echo "signed $f ($SUM)"
          done

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: signed
          path: bin/
          if-no-files-found: error

  # ─── Release archives ────────────────────────────────────────────
  package:
    name: Package archives
    needs: sign
    runs-on: ubuntu-latest
    permissions: {}
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: signed
          path: signed
      - name: Archive
        run: |
          set -eu
          mkdir -p out
          cd signed
          for f in hy2scale-*; do
            case "$f" in *.sig) continue ;; esac
            chmod 0755 "$f"
            tar czf "../out/$f.tar.gz" "$f" "$f.sig"
          done
          ls -la ../out
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: archives
          path: out/
          if-no-files-found: error

  # ─── Docker image + iKuai ipkg (per arch) ────────────────────────
  # The image takes the signed binary (Dockerfile, BIN=release), so it runs
  # the signed bytes. ipkg file name: hy2scale-<x86|arm64>-<version>.ipkg.
  docker:
    name: Docker + ipkg (${{ matrix.arch }})
    needs: [version, sign]
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
    strategy:
      fail-fast: true
      matrix:
        include:
          - { arch: amd64, arch_label: x86, platform: linux/amd64, runner: ubuntu-latest }
          - { arch: arm64, arch_label: arm64, platform: linux/arm64, runner: ubuntu-24.04-arm }
    env:
      VERSION: ${{ needs.version.outputs.version }}
      ARCH: ${{ matrix.arch }}
      ARCH_LABEL: ${{ matrix.arch_label }}
      PLATFORM: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: signed
          path: release

      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0

      - name: Build image
        run: |
          set -eu
          docker buildx build --platform "$PLATFORM" --build-arg BIN=release \
            --tag "frankoong/hy2scale:${VERSION}" --tag hy2scale:ikuai --load .
          docker run --rm --entrypoint sh hy2scale:ikuai -c 'ls -l /usr/local/bin/hy2scale /usr/local/bin/hy2scale.sig'

      - name: Export image
        run: docker save "frankoong/hy2scale:${VERSION}" | gzip > "docker-image-${ARCH}.tar.gz"

      - name: Build ipkg
        run: |
          set -eu
          # The ipkg manifest version must be plain X.Y.Z (iKuai rejects -rc1).
          RAW_VERSION="$(sed -n 's/^const Version = "\(.*\)"$/\1/p' internal/api/server.go)"
          IPKG_VERSION="${RAW_VERSION%%-*}"
          sed -i "s/\"version\": *\"[^\"]*\"/\"version\": \"${IPKG_VERSION}\"/" platform/ikuai/hy2scale/manifest.json
          docker save hy2scale:ikuai | gzip > platform/ikuai/hy2scale/docker_image.tar.gz
          (cd platform/ikuai && tar czf "hy2scale-${ARCH_LABEL}-${VERSION}.ipkg" hy2scale/)
          rm -f platform/ikuai/hy2scale/docker_image.tar.gz

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: docker-image-${{ matrix.arch }}
          path: docker-image-${{ matrix.arch }}.tar.gz
          if-no-files-found: error

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: ipkg-${{ matrix.arch }}
          path: platform/ikuai/hy2scale-${{ matrix.arch_label }}-${{ needs.version.outputs.version }}.ipkg
          if-no-files-found: error

  # ─── OpenWrt packages (no secrets) ───────────────────────────────
  # platform/openwrt/build.sh packages the signed binaries: hy2scale per
  # OpenWrt architecture plus luci-app-hy2scale, as .ipk (opkg) and .apk
  # (apk-tools v3). The release gets them under flat names.
  openwrt:
    name: OpenWrt packages
    needs: [version, sign]
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      VERSION: ${{ needs.version.outputs.version }}
      TOOLS: ${{ github.workspace }}/.owrt-tools
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: signed
          path: signed

      # apk-tools v3, usign and po2lmo from the sources OpenWrt pins
      # (platform/openwrt/tools/build-host-tools.sh); cached on that file.
      - uses: actions/cache@0400d5f644dc74513175e3cd8d07132dd4860809 # v4.2.4
        id: tools
        with:
          path: .owrt-tools
          key: owrt-tools-${{ runner.os }}-${{ hashFiles('platform/openwrt/tools/build-host-tools.sh') }}

      - name: Host tools
        env:
          CACHED: ${{ steps.tools.outputs.cache-hit }}
        run: |
          set -eu
          PKGS="fakeroot"
          [ "$CACHED" = true ] || PKGS="$PKGS meson ninja-build pkg-config libssl-dev zlib1g-dev"
          sudo apt-get update -qq
          sudo apt-get install -y -qq --no-install-recommends $PKGS
          bash platform/openwrt/tools/build-host-tools.sh "$TOOLS"

      - name: Build packages
        run: |
          set -eu
          bash platform/openwrt/build.sh --bin-dir signed --out openwrt --version "$VERSION" \
            --tools "$TOOLS/bin" --release-assets
          # sums of every architecture's packages (attached to the release,
          # so the run's artifact can be checked against it)
          (cd openwrt/release && sha256sum -- *.ipk *.apk > openwrt-sha256.txt)
          # the release carries x86_64 and the LuCI app; the rest stay in
          # this run's artifact
          mkdir -p openwrt/attach
          cp openwrt/release/*_x86_64.ipk openwrt/release/*_x86_64.apk             openwrt/release/luci-app-hy2scale* openwrt/release/openwrt-sha256.txt openwrt/attach/
          ls -la openwrt/attach

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: openwrt-packages
          path: openwrt/attach/
          if-no-files-found: error

      # every architecture, linked from the release notes
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: openwrt-packages-all
          path: openwrt/release/
          if-no-files-found: error
          retention-days: 90

  # ─── GitHub release ──────────────────────────────────────────────
  release:
    name: Create release
    needs: [version, package, docker, openwrt]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      TAG: ${{ needs.version.outputs.tag }}
      VERSION: ${{ needs.version.outputs.version }}
      PRERELEASE: ${{ needs.version.outputs.prerelease }}
      RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
          fetch-depth: 0

      # Only what the release carries.
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          pattern: "{archives,docker-image-*,ipkg-*,openwrt-packages}"
          path: artifacts

      - name: Collect assets
        run: |
          set -eu
          mkdir -p release
          cp artifacts/archives/*.tar.gz release/
          cp artifacts/docker-image-*/*.tar.gz release/
          cp artifacts/ipkg-*/*.ipkg release/
          cp artifacts/openwrt-packages/* release/
          (cd release && sha256sum -- * > checksums-sha256.txt && cat checksums-sha256.txt)

      # a release is compared with the previous release, a pre-release with
      # the previous tag of any kind
      - name: Previous release
        run: |
          set -eu
          if [ "$PRERELEASE" = true ]; then
            PREV="$(git describe --tags --abbrev=0 "refs/tags/${TAG}^" 2>/dev/null || true)"
          else
            PREV="$(git describe --tags --abbrev=0 --exclude '*-*' "refs/tags/${TAG}^" 2>/dev/null || true)"
          fi
          echo "PREV=${PREV}" >> "$GITHUB_ENV"
          echo "previous: ${PREV:-none}"

      # A summary of the changes by the newest "luna" model of the API in
      # RELEASE_AI_BASE_URL (variable) with RELEASE_AI_KEY (secret); skipped
      # when either is unset, and never fails the release.
      - name: Highlights
        continue-on-error: true
        env:
          RELEASE_AI_KEY: ${{ secrets.RELEASE_AI_KEY }}
          RELEASE_AI_BASE_URL: ${{ vars.RELEASE_AI_BASE_URL }}
        run: |
          : > highlights.md
          [ -n "$PREV" ] || { echo "no previous release"; exit 0; }
          bash .github/scripts/release-highlights.sh "refs/tags/${PREV}" "refs/tags/${TAG}" highlights.md
          cat highlights.md

      - name: Release notes
        run: |
          set -eu
          RAW="https://raw.githubusercontent.com/${GITHUB_REPOSITORY}/main/install.sh"
          WIKI="https://github.com/${GITHUB_REPOSITORY}/wiki/Installation"
          {
            echo "## hy2scale ${VERSION}"
            echo
            if [ -s highlights.md ]; then
              echo "### Highlights"
              echo
              cat highlights.md
              echo
              echo "<sub>Summarised by an AI model from the changes listed at the end.</sub>"
              echo
            fi
            echo "### Install or upgrade"
            echo
            echo "| Where | How |"
            echo "|---|---|"
            echo "| Linux (systemd), UniFi OS | \`curl -fsSL ${RAW} \| sudo sh\` |"
            echo "| OpenWrt and derivatives | \`wget -qO- ${RAW} \| sh\` (as root) |"
            echo "| Docker | \`docker pull frankoong/hy2scale:${VERSION}\` |"
            echo "| iKuai v4 | \`hy2scale-x86-${VERSION}.ipkg\` or \`hy2scale-arm64-${VERSION}.ipkg\`, installed locally from the app store |"
            echo
            echo "Nodes on an earlier version can also upgrade from **Settings → Upgrade**. Details: [Installation](${WIKI})."
            echo
            echo "### Files"
            echo
            echo "- **Binaries:** \`hy2scale-linux-<platform>.tar.gz\` for amd64, 386, arm64, armv7, armv6, armv5, mips-softfloat, mipsle-softfloat, mips64, mips64le, riscv64 and loong64. Each one is signed (\`.sig\` in the archive); an official build checks the signature before it upgrades."
            echo "- **Docker image, offline:** \`docker-image-amd64.tar.gz\`, \`docker-image-arm64.tar.gz\` (\`docker load < file\`)."
            echo "- **OpenWrt, x86_64:** \`hy2scale_*_x86_64.ipk\` with \`luci-app-hy2scale_*_all.ipk\` (opkg, 24.10 and earlier), or \`hy2scale-*_x86_64.apk\` with \`luci-app-hy2scale-*.apk\` (apk, 25.12 and later). Install both of a pair."
            echo "- **OpenWrt, other architectures:** the \`openwrt-packages-all\` artifact of [this build](${RUN_URL}) (GitHub sign-in needed, kept 90 days). \`openwrt-sha256.txt\` lists the checksums of every architecture's packages."
            echo "- **Checksums:** \`sha256sum -c --ignore-missing checksums-sha256.txt\` in the folder with the downloaded files."
            echo
            echo "<details>"
            if [ -n "$PREV" ]; then
              echo "<summary>Changes since ${PREV}</summary>"
              echo
              git log "refs/tags/${PREV}..refs/tags/${TAG}" --pretty=format:"- %s (%h)" --no-merges
            else
              echo "<summary>All changes</summary>"
              echo
              git log "refs/tags/${TAG}" --pretty=format:"- %s (%h)" --no-merges
            fi
            echo
            echo
            echo "</details>"
          } > notes.md
          cat notes.md

      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -eu
          FLAGS=""
          [ "$PRERELEASE" = true ] && FLAGS="--prerelease"
          gh release create "$TAG" release/* --repo "$GITHUB_REPOSITORY" --title "$TAG" --notes-file notes.md --verify-tag $FLAGS

  # ─── Docker Hub ──────────────────────────────────────────────────
  # Per-arch tags are pushed, glued into one multi-arch manifest (plus
  # :latest for a final release), then the per-arch tags are removed.
  publish-docker:
    name: Publish to Docker Hub
    needs: [version, release]
    runs-on: ubuntu-latest
    permissions: {}
    env:
      VERSION: ${{ needs.version.outputs.version }}
      IMG: frankoong/hy2scale
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          pattern: docker-image-*
          merge-multiple: true
          path: images

      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3.7.0
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Push per-arch images and the manifest
        run: |
          set -eu
          for arch in amd64 arm64; do
            gunzip -c "images/docker-image-${arch}.tar.gz" | docker load
            docker tag "${IMG}:${VERSION}" "${IMG}:${VERSION}-${arch}"
            docker push "${IMG}:${VERSION}-${arch}"
          done
          docker manifest create "${IMG}:${VERSION}" --amend "${IMG}:${VERSION}-amd64" --amend "${IMG}:${VERSION}-arm64"
          docker manifest push "${IMG}:${VERSION}"
          case "$VERSION" in
            *-*) echo "pre-release ${VERSION}: :latest left as is" ;;
            *)
              docker manifest create "${IMG}:latest" --amend "${IMG}:${VERSION}-amd64" --amend "${IMG}:${VERSION}-arm64"
              docker manifest push "${IMG}:latest"
              ;;
          esac

      - name: Remove the per-arch tags
        env:
          HUB_USER: ${{ secrets.DOCKERHUB_USERNAME }}
          HUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
        run: |
          set -eu
          # The login body goes through stdin, never the command line.
          JWT="$(jq -n --arg u "$HUB_USER" --arg p "$HUB_TOKEN" '{username:$u,password:$p}' \
            | curl -fsS -X POST -H "Content-Type: application/json" --data-binary @- https://hub.docker.com/v2/users/login/ \
            | jq -r .token)" || true
          if [ -z "$JWT" ] || [ "$JWT" = null ]; then
            echo "::warning::Docker Hub API login failed; per-arch tags left in place"
            exit 0
          fi
          for arch in amd64 arm64; do
            HTTP="$(curl -sS -o /dev/null -w '%{http_code}' -X DELETE -H "Authorization: JWT ${JWT}" \
              "https://hub.docker.com/v2/repositories/${IMG}/tags/${VERSION}-${arch}/" || echo 000)"
            echo "delete ${IMG}:${VERSION}-${arch}: HTTP ${HTTP}"
          done
