name: Release

# Runs only on the code of a release tag: a tag push, or a manual run
# started from the tag itself ("Use workflow from" = the tag;
# trigger-release.yml does that after creating the tag).
#
# Jobs and what they may touch:
#   version   reads the tag and the version constant      no token, no secrets
#   build     builds the binaries (runs npm and go)       read-only token
#   sign      signs the built binaries                    the signing key only;
#             (environment "release"; never checks out    no repository code
#             or runs repository code)
#   package / docker   archives, images, iKuai packages   read-only token
#   release   publishes the GitHub release                contents: write
#   publish-docker     pushes to Docker Hub               Docker Hub token only
on:
  push:
    tags:
      - "[0-9]*"
      - "v[0-9]*"
  workflow_dispatch:

permissions: {}

concurrency:
  group: release-${{ github.ref_name }}
  cancel-in-progress: false

env:
  GO_VERSION: "1.27"
  # Public half of the release signing key (internal/buildsig: "hy2scale-1").
  SIGNING_KEY_ID: hy2scale-1
  SIGNING_PUBLIC_KEY: qacIdvM9YVk+SbRNEsSiXqTyxTizsKKlJm06Z1KyYlc=

jobs:
  version:
    name: Resolve version
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      tag: ${{ steps.v.outputs.tag }}
      version: ${{ steps.v.outputs.version }}
      binary_version: ${{ steps.v.outputs.binary_version }}
      prerelease: ${{ steps.v.outputs.prerelease }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
          sparse-checkout: internal/api/server.go
          sparse-checkout-cone-mode: false
      - id: v
        env:
          REF_TYPE: ${{ github.ref_type }}
          TAG: ${{ github.ref_name }}
        run: |
          set -eu
          if [ "$REF_TYPE" != tag ]; then
            echo "::error::run this workflow from a release tag (Use workflow from: <tag>)"
            exit 1
          fi
          if ! printf '%s' "$TAG" | grep -Eq '^v?[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.]+)?$'; then
            echo "::error::not a release tag: $TAG"
            exit 1
          fi
          VERSION="${TAG#v}"
          BINVER="$(sed -n 's/^const Version = "\([0-9A-Za-z.-]*\)"$/\1/p' internal/api/server.go)"
          case "$VERSION" in
            "$BINVER"|"$BINVER"-*) ;;
            *) echo "::error::tag $TAG does not match the source version $BINVER"; exit 1 ;;
          esac
          {
            echo "tag=$TAG"
            echo "version=$VERSION"
            echo "binary_version=$BINVER"
            case "$VERSION" in *-*) echo "prerelease=true" ;; *) echo "prerelease=false" ;; esac
          } >> "$GITHUB_OUTPUT"

  # ─── Binaries (no secrets) ───────────────────────────────────────
  build:
    name: Build ${{ matrix.platform }}
    needs: version
    runs-on: ubuntu-latest
    permissions:
      contents: read
    strategy:
      fail-fast: true
      matrix:
        include:
          - { platform: linux-amd64, goarch: amd64 }
          - { platform: linux-arm64, goarch: arm64 }
          - { platform: linux-armv7, goarch: arm, goarm: "7" }
          - { platform: linux-mips64le, goarch: mips64le }
          - { platform: linux-mipsle-softfloat, goarch: mipsle, gomips: softfloat }
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 20

      # The binary embeds internal/web/static: build the frontend from this
      # commit first, never ship the committed bundle.
      - name: Build frontend
        run: |
          set -eux
          (cd web/ui-framework && npm ci && npm run build)
          (cd web/app && npm ci && npm run build)
          rm -rf internal/web/static
          mkdir -p internal/web/static
          cp -r web/app/dist/. internal/web/static/

      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: false

      - name: Build binary
        env:
          CGO_ENABLED: "0"
          GOOS: linux
          GOARCH: ${{ matrix.goarch }}
          GOARM: ${{ matrix.goarm }}
          GOMIPS: ${{ matrix.gomips }}
          PLATFORM: ${{ matrix.platform }}
        run: |
          set -eu
          go build -trimpath -ldflags="-s -w" -o "hy2scale-${PLATFORM}" ./cmd/node
          sha256sum "hy2scale-${PLATFORM}"

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: bin-${{ matrix.platform }}
          path: hy2scale-${{ matrix.platform }}
          if-no-files-found: error

  # ─── Signing (the key, nothing else) ─────────────────────────────
  # Configure the "release" environment in the repository settings: the
  # secret RELEASE_SIGNING_KEY (the Ed25519 private key, PEM) and a
  # deployment rule that allows release tags only.
  sign:
    name: Sign binaries
    needs: [version, build]
    runs-on: ubuntu-latest
    environment: release
    permissions: {}
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          pattern: bin-*
          merge-multiple: true
          path: bin

      - name: Sign
        env:
          SIGNING_KEY: ${{ secrets.RELEASE_SIGNING_KEY }}
          VERSION: ${{ needs.version.outputs.binary_version }}
          TAG: ${{ needs.version.outputs.tag }}
          COMMIT: ${{ github.sha }}
        run: |
          set -eu
          if [ -z "$SIGNING_KEY" ]; then
            echo "::error::RELEASE_SIGNING_KEY is not set in the release environment"
            exit 1
          fi
          umask 077
          KEY="$RUNNER_TEMP/release.key"
          trap 'rm -f "$KEY"' EXIT
          printf '%s\n' "$SIGNING_KEY" > "$KEY"
          PUB="$(openssl pkey -in "$KEY" -pubout -outform DER | tail -c 32 | base64 -w0)"
          if [ "$PUB" != "$SIGNING_PUBLIC_KEY" ]; then
            echo "::error::RELEASE_SIGNING_KEY is not the key $SIGNING_KEY_ID"
            exit 1
          fi
          cd bin
          for f in hy2scale-*; do
            PLATFORM="${f#hy2scale-}"
            SUM="$(sha256sum "$f" | cut -d' ' -f1)"
            jq -cn --arg v "$VERSION" --arg p "$PLATFORM" --arg s "$SUM" --arg c "$COMMIT" --arg t "$TAG" \
              '{name:"hy2scale",version:$v,platform:$p,sha256:$s,commit:$c,tag:$t}' > "$RUNNER_TEMP/m.json"
            openssl pkeyutl -sign -inkey "$KEY" -rawin -in "$RUNNER_TEMP/m.json" -out "$RUNNER_TEMP/m.sig"
            jq -cn --arg k "$SIGNING_KEY_ID" --arg m "$(base64 -w0 "$RUNNER_TEMP/m.json")" --arg s "$(base64 -w0 "$RUNNER_TEMP/m.sig")" \
              '{key:$k,manifest:$m,sig:$s}' > "$f.sig"
            echo "signed $f ($SUM)"
          done

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: signed
          path: bin/
          if-no-files-found: error

  # ─── Release archives ────────────────────────────────────────────
  package:
    name: Package archives
    needs: sign
    runs-on: ubuntu-latest
    permissions: {}
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: signed
          path: signed
      - name: Archive
        run: |
          set -eu
          mkdir -p out
          cd signed
          for f in hy2scale-*; do
            case "$f" in *.sig) continue ;; esac
            chmod 0755 "$f"
            tar czf "../out/$f.tar.gz" "$f" "$f.sig"
          done
          ls -la ../out
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: archives
          path: out/
          if-no-files-found: error

  # ─── Docker image + iKuai ipkg (per arch) ────────────────────────
  # The image takes the signed binary (Dockerfile, BIN=release), so it runs
  # the signed bytes. ipkg file name: hy2scale-<x86|arm64>-<version>.ipkg.
  docker:
    name: Docker + ipkg (${{ matrix.arch }})
    needs: [version, sign]
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
    strategy:
      fail-fast: true
      matrix:
        include:
          - { arch: amd64, arch_label: x86, platform: linux/amd64, runner: ubuntu-latest }
          - { arch: arm64, arch_label: arm64, platform: linux/arm64, runner: ubuntu-24.04-arm }
    env:
      VERSION: ${{ needs.version.outputs.version }}
      ARCH: ${{ matrix.arch }}
      ARCH_LABEL: ${{ matrix.arch_label }}
      PLATFORM: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: signed
          path: release

      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0

      - name: Build image
        run: |
          set -eu
          docker buildx build --platform "$PLATFORM" --build-arg BIN=release \
            --tag "frankoong/hy2scale:${VERSION}" --tag hy2scale:ikuai --load .
          docker run --rm --entrypoint sh hy2scale:ikuai -c 'ls -l /usr/local/bin/hy2scale /usr/local/bin/hy2scale.sig'

      - name: Export image
        run: docker save "frankoong/hy2scale:${VERSION}" | gzip > "docker-image-${ARCH}.tar.gz"

      - name: Build ipkg
        run: |
          set -eu
          # The ipkg manifest version must be plain X.Y.Z (iKuai rejects -rc1).
          RAW_VERSION="$(sed -n 's/^const Version = "\(.*\)"$/\1/p' internal/api/server.go)"
          IPKG_VERSION="${RAW_VERSION%%-*}"
          sed -i "s/\"version\": *\"[^\"]*\"/\"version\": \"${IPKG_VERSION}\"/" ipkg/hy2scale/manifest.json
          docker save hy2scale:ikuai | gzip > ipkg/hy2scale/docker_image.tar.gz
          (cd ipkg && tar czf "hy2scale-${ARCH_LABEL}-${VERSION}.ipkg" hy2scale/)
          rm -f ipkg/hy2scale/docker_image.tar.gz

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: docker-image-${{ matrix.arch }}
          path: docker-image-${{ matrix.arch }}.tar.gz
          if-no-files-found: error

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: ipkg-${{ matrix.arch }}
          path: ipkg/hy2scale-${{ matrix.arch_label }}-${{ needs.version.outputs.version }}.ipkg
          if-no-files-found: error

  # ─── GitHub release ──────────────────────────────────────────────
  release:
    name: Create release
    needs: [version, package, docker]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      TAG: ${{ needs.version.outputs.tag }}
      VERSION: ${{ needs.version.outputs.version }}
      PRERELEASE: ${{ needs.version.outputs.prerelease }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
          fetch-depth: 0

      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          path: artifacts

      - name: Collect assets
        run: |
          set -eu
          mkdir -p release
          cp artifacts/archives/*.tar.gz release/
          cp artifacts/docker-image-*/*.tar.gz release/
          cp artifacts/ipkg-*/*.ipkg release/
          (cd release && sha256sum -- * > checksums-sha256.txt && cat checksums-sha256.txt)

      - name: Release notes
        run: |
          set -eu
          PREV="$(git describe --tags --abbrev=0 "${TAG}^" 2>/dev/null || true)"
          {
            echo "## hy2scale ${TAG}"
            echo
            echo "### Binary downloads"
            echo
            echo "| Platform | File |"
            echo "|----------|------|"
            for p in linux-amd64 linux-arm64 linux-armv7 linux-mips64le linux-mipsle-softfloat; do
              echo "| ${p} | \`hy2scale-${p}.tar.gz\` |"
            done
            echo
            echo "Every binary is signed by this workflow (\`hy2scale-<platform>.sig\` in the archive); a node running an official build checks it before an upgrade."
            echo
            echo "### Docker image"
            echo
            echo '```bash'
            echo "docker pull frankoong/hy2scale:${VERSION}"
            echo '```'
            echo
            echo "Offline: \`docker load < docker-image-amd64.tar.gz\` (or \`-arm64\`)."
            echo
            echo "### iKuai package"
            echo
            echo "- \`hy2scale-x86-${VERSION}.ipkg\` for x86 / x86_64 iKuai"
            echo "- \`hy2scale-arm64-${VERSION}.ipkg\` for arm64 / aarch64 iKuai"
            echo
            echo "### Verify checksums"
            echo
            echo '```'
            echo 'sha256sum -c checksums-sha256.txt'
            echo '```'
            echo
            echo "<details>"
            if [ -n "$PREV" ]; then
              echo "<summary>Changelog since ${PREV}</summary>"
              echo
              git log "${PREV}..${TAG}" --pretty=format:"- %s (%h)" --no-merges
            else
              echo "<summary>Full commit history</summary>"
              echo
              git log "${TAG}" --pretty=format:"- %s (%h)" --no-merges
            fi
            echo
            echo
            echo "</details>"
          } > notes.md

      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -eu
          FLAGS=""
          [ "$PRERELEASE" = true ] && FLAGS="--prerelease"
          gh release create "$TAG" release/* --repo "$GITHUB_REPOSITORY" --title "$TAG" --notes-file notes.md --verify-tag $FLAGS

  # ─── Docker Hub ──────────────────────────────────────────────────
  # Per-arch tags are pushed, glued into one multi-arch manifest (plus
  # :latest for a final release), then the per-arch tags are removed.
  publish-docker:
    name: Publish to Docker Hub
    needs: [version, release]
    runs-on: ubuntu-latest
    permissions: {}
    env:
      VERSION: ${{ needs.version.outputs.version }}
      IMG: frankoong/hy2scale
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          pattern: docker-image-*
          merge-multiple: true
          path: images

      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3.7.0
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Push per-arch images and the manifest
        run: |
          set -eu
          for arch in amd64 arm64; do
            gunzip -c "images/docker-image-${arch}.tar.gz" | docker load
            docker tag "${IMG}:${VERSION}" "${IMG}:${VERSION}-${arch}"
            docker push "${IMG}:${VERSION}-${arch}"
          done
          docker manifest create "${IMG}:${VERSION}" --amend "${IMG}:${VERSION}-amd64" --amend "${IMG}:${VERSION}-arm64"
          docker manifest push "${IMG}:${VERSION}"
          case "$VERSION" in
            *-*) echo "pre-release ${VERSION}: :latest left as is" ;;
            *)
              docker manifest create "${IMG}:latest" --amend "${IMG}:${VERSION}-amd64" --amend "${IMG}:${VERSION}-arm64"
              docker manifest push "${IMG}:latest"
              ;;
          esac

      - name: Remove the per-arch tags
        env:
          HUB_USER: ${{ secrets.DOCKERHUB_USERNAME }}
          HUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
        run: |
          set -eu
          # The login body goes through stdin, never the command line.
          JWT="$(jq -n --arg u "$HUB_USER" --arg p "$HUB_TOKEN" '{username:$u,password:$p}' \
            | curl -fsS -X POST -H "Content-Type: application/json" --data-binary @- https://hub.docker.com/v2/users/login/ \
            | jq -r .token)" || true
          if [ -z "$JWT" ] || [ "$JWT" = null ]; then
            echo "::warning::Docker Hub API login failed; per-arch tags left in place"
            exit 0
          fi
          for arch in amd64 arm64; do
            HTTP="$(curl -sS -o /dev/null -w '%{http_code}' -X DELETE -H "Authorization: JWT ${JWT}" \
              "https://hub.docker.com/v2/repositories/${IMG}/tags/${VERSION}-${arch}/" || echo 000)"
            echo "delete ${IMG}:${VERSION}-${arch}: HTTP ${HTTP}"
          done
