name: Trigger Release

# A commit on main whose subject is "release: vX.Y.Z" tags that commit and
# starts the release workflow on the tag. (A tag pushed with the workflow's
# own token starts no workflow by itself, so the release is dispatched.)
on:
  push:
    branches:
      - main

permissions: {}

jobs:
  check-and-tag:
    name: Check for release trigger
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 1

      - name: Check commit message for release trigger
        id: check
        run: |
          set -eu
          MSG="$(git log -1 --pretty=%s)"
          TAG="$(printf '%s' "$MSG" | sed -n -E 's/^release:[[:space:]]*(v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.]+)?)[[:space:]]*$/\1/p')"
          if [ -n "$TAG" ]; then
            echo "tag=${TAG}" >> "$GITHUB_OUTPUT"
            echo "::notice::Release triggered for ${TAG}"
          else
            echo "::notice::No release trigger in commit message"
          fi

      - name: Create and push tag, start the release
        if: steps.check.outputs.tag != ''
        env:
          TAG: ${{ steps.check.outputs.tag }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -eu
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git tag -a "${TAG}" -m "Release ${TAG}"
          git push origin "${TAG}"
          # the full ref: a version branch of the same name would win over the tag
          gh workflow run release.yml --repo "$GITHUB_REPOSITORY" --ref "refs/tags/${TAG}"
          echo "::notice::Tagged ${TAG} and started the release workflow"
